[package]
name = "myokr"
version = "0.1.13"
description = "myOKR - Pomodoro Timer Desktop App"
authors = ["Trong Dinh"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "myokr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
opt-level = 'z'        # Optimize for size
lto = true             # Link Time Optimization
codegen-units = 1      # Reduce codegen units for maximum size optimization
panic = 'abort'        # Remove panic unwinding logic to save space
strip = true           # Automatically strip symbols and debuginfo

